name: Build                       # nome que aparece na aba Actions

on:                               # quando o roteiro roda
  push:
    branches: [main]              # push na branch do jogo (trocar para main depois)
    tags: ['v*']                  # qualquer tag que comece com "v" dispara o workflow
  pull_request:                   # a cada pull request
  workflow_dispatch:              # botão manual (só aparece com o arquivo na main)

jobs:
  build:
    name: Build (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}     # a máquina que o GitHub empresta
    strategy:
      fail-fast: false            # se um sistema falhar, os outros continuam
      matrix:                     # o mesmo roteiro roda uma vez por linha
        include:
          - { nome: linux,   os: ubuntu-22.04,  bin: build,         ext: "" }
          - { nome: windows, os: windows-latest, bin: build/Release, ext: ".exe" }
          - { nome: macos,   os: macos-latest,   bin: build,         ext: "" }

    steps:
      - uses: actions/checkout@v7   # baixa o código do repositório

      - name: Testes do Makefile (só Linux)
        if: runner.os == 'Linux'
        run: make BUILD=build-make test

      - name: Configurar (só terminal, sem raylib)
        run: cmake -S . -B build -DULTIMO_TURNO_BUILD_JOGO=OFF

      - name: Compilar
        # --config Release é usado pelo Visual Studio; nos geradores de
        # configuração única (Linux/macOS) ele é simplesmente ignorado.
        run: cmake --build build --config Release

      - name: Rodar os testes
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empacotar
        shell: bash               # bash também no Windows
        run: |
          mkdir -p dist
          cp "${{ matrix.bin }}/jogo-terminal${{ matrix.ext }}" dist/

      - uses: actions/upload-artifact@v7   # guarda o resultado para download
        with:
          name: ultimo-turno-${{ matrix.nome }}
          path: dist
          if-no-files-found: error

  grafico:                          # job novo, independente do job do terminal
    name: Gráfico (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: linux,   os: ubuntu-22.04,  bin: build,         ext: "" }
          - { nome: windows, os: windows-latest, bin: build/Release, ext: ".exe" }
          - { nome: macos,   os: macos-latest,   bin: build,         ext: "" }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # baixa a raylib (fixada na tag 6.2)

      - name: Dependências da raylib (Linux)
        if: runner.os == 'Linux'    # só o Linux precisa instalar isto
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configurar (com raylib)
        run: cmake -S . -B build    # sem o OFF: liga o alvo gráfico

      - name: Compilar o jogo gráfico
        run: cmake --build build --config Release --target jogo

      - name: Empacotar
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin }}/jogo${{ matrix.ext }}" dist/
          if [ -d assets ]; then cp -r assets dist/; fi   # opcional: só copia se existir

      - uses: actions/upload-artifact@v7
        with:
          name: ultimo-turno-grafico-${{ matrix.nome }}
          path: dist
          if-no-files-found: error
          
  release:
    name: Publicar release
    needs: [build, grafico]                 # só roda se os builds passaram
    if: >-                                  # só em push (nunca em pull request) na tag ou na branch principal
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write                       # permissão para criar tag e release

    steps:
      - name: Definir a versão
        id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"                   # tag criada à mão
          else
            echo "tag=v0.1.0-alpha.${{ github.run_number }}" >> "$GITHUB_OUTPUT"   # tag automática
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Empacotar um arquivo por sistema
        env:
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          set -e
          mkdir -p release
          for pasta in artefatos/*/; do
            nome=$(basename "$pasta")
            case "$nome" in
              *windows*)
                (cd "$pasta" && zip -r "../../release/${nome}-${TAG}.zip" .) ;;
              *)
                chmod +x "$pasta"/jogo* 2>/dev/null || true
                tar -czf "release/${nome}-${TAG}.tar.gz" -C "$pasta" . ;;
            esac
          done

      - name: Criar a release (pré-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "O Último Turno $TAG" \
            --generate-notes
